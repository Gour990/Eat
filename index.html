<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Battle 🍔</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3d6;--card:#fff;--tx:#2b1b0e;--mut:#8a6f55;--ac:#ff5a1f;--ac2:#ffb703;--me:#1f9d55;--op:#d62839;--line:#f0d9a8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1409;--card:#2c1f12;--tx:#fff1da;--mut:#c4a47c;--line:#4a3520}}
:root[data-theme="dark"]{--bg:#1d1409;--card:#2c1f12;--tx:#fff1da;--mut:#c4a47c;--line:#4a3520}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Baloo 2",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent;user-select:none}
.app{width:100%;max-width:460px;padding:16px;display:flex;flex-direction:column;gap:12px}
h1{margin:6px 0 0;font-size:2rem;text-align:center;font-weight:800}
.sub{text-align:center;color:var(--mut);margin:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px}
input{width:100%;font:inherit;font-size:1.1rem;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--tx)}
.code{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:800}
button{font:inherit;font-weight:800;font-size:1.1rem;border:0;border-radius:14px;padding:12px 16px;background:var(--ac);color:#fff;cursor:pointer}
button.alt{background:var(--ac2);color:#2b1b0e}
button.ghost{background:transparent;color:var(--mut);border:2px solid var(--line)}
button:disabled{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1}
.av{display:flex;gap:6px;justify-content:space-between;margin:10px 0}
.av span{font-size:1.8rem;padding:4px 6px;border-radius:12px;border:3px solid transparent;cursor:pointer}
.av span.on{border-color:var(--ac);background:var(--bg)}
.big{font-size:3.6rem;text-align:center;letter-spacing:.25em;font-weight:800;margin:4px 0;color:var(--ac);user-select:text}
.hide{display:none!important}
.pl{display:flex;align-items:center;gap:10px;padding:6px 0}
.pl .e{font-size:2rem}
.top{display:flex;gap:8px}
.pc{flex:1;text-align:center;border-radius:16px;padding:8px;background:var(--card);border:3px solid var(--me)}
.pc.op{border-color:var(--op)}
.pc .e{font-size:2.8rem;display:block;line-height:1.1}
.pc .s{font-size:1.8rem;font-weight:800}
.pc .n{font-size:.9rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.chew{animation:chew .18s}
@keyframes chew{50%{transform:scale(1.25) rotate(-8deg)}}
.bar{height:16px;border-radius:99px;background:var(--op);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--me);transition:width .2s}
.t{text-align:center;font-size:1.6rem;font-weight:800}
#food{position:relative;height:250px;border-radius:24px;background:var(--card);border:3px dashed var(--ac);display:flex;align-items:center;justify-content:center;touch-action:manipulation;cursor:pointer;overflow:hidden}
#food.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#pop{position:absolute;top:10px;width:100%;text-align:center;font-size:1.5rem;font-weight:800;color:var(--ac);pointer-events:none}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:5rem;font-weight:800;background:var(--card);color:var(--ac)}
.msg{text-align:center;color:var(--mut)}
.dif button{padding:8px 4px;font-size:1rem}.dif button.on{background:var(--ac2);color:#2b1b0e;border-color:var(--ac2)}
</style>
</head>
<body>
<div class="app">
<h1>🍔 Food Battle 🍕</h1>
<p class="sub">Out-eat your friend and win!</p>
<div id="nomp" class="card msg hide">Online play is not available in this view. Open the link in the Claude app or browser while signed in.</div>

<section id="s-lobby" class="card">
<input id="nm" maxlength="12" placeholder="Your name">
<div class="av" id="avs"></div>
<button id="mk" style="width:100%">🏠 Create a room</button>
<p class="msg" style="margin:10px 0">— or enter your friend’s code —</p>
<div class="row"><input id="cd-in" class="code" maxlength="4" placeholder="CODE"><button id="jn" class="alt">Join</button></div>
<p class="msg" style="margin:10px 0">— or play solo —</p>
<div class="row dif"><button class="ghost">Easy</button><button class="ghost on">Medium</button><button class="ghost">Hard</button></div>
<button id="bt" class="alt" style="width:100%;margin-top:8px">🤖 Play vs Bot</button>
<p id="err" class="msg"></p>
</section>

<section id="s-wait" class="card hide">
<p class="msg" style="margin:0">Room code (send it to your friend)</p>
<div class="big" id="rc"></div>
<button id="cp" class="alt" style="width:100%">📋 Copy code</button>
<div id="pls" style="margin-top:8px"></div>
<p id="wm" class="msg"></p>
<button id="go" style="width:100%" disabled>▶️ Start game</button>
<button id="lv" class="ghost" style="width:100%;margin-top:8px">Leave room</button>
</section>

<section id="s-game" class="hide">
<div class="top">
<div class="pc"><span class="e" id="me-e"></span><span class="s" id="me-s">0</span><span class="n" id="me-n"></span></div>
<div class="pc op"><span class="e" id="op-e"></span><span class="s" id="op-s">0</span><span class="n" id="op-n"></span></div>
</div>
<div class="bar" style="margin:10px 0"><i id="tug"></i></div>
<div class="t">⏱️ <span id="tm">30</span></div>
<div id="food" style="margin:10px 0"><span id="fe"></span><div id="pop"></div><div id="cd">3</div></div>
<button id="sk" class="ghost" style="width:100%">🚫 Spit it out! (yuck, broccoli)</button>
</section>

<section id="s-end" class="card hide">
<div class="big" id="res" style="letter-spacing:0;font-size:2.2rem"></div>
<p class="msg" id="fs"></p>
<button id="again" style="width:100%">🔁 Play again</button>
<button id="lv2" class="ghost" style="width:100%;margin-top:8px">Leave room</button>
</section>
</div>
<script>
const $=s=>document.querySelector(s),FOODS=[{e:'🍔',b:5,p:10},{e:'🍕',b:4,p:8},{e:'🍟',b:3,p:5},{e:'🌭',b:3,p:6},{e:'🌮',b:4,p:8},{e:'🍩',b:2,p:4},{e:'🍗',b:4,p:8},{e:'🥦',bad:1}],AV=['😋','🤪','😎','🥳','🤠','🦖'],YUM=['Yum!','Tasty!','Epic!','Burp 😮‍💨','So good!'];
let bot=false,diff=1,botAcc=0,botTimer=null,R=null,room=null,host=false,code='',round=0,st='lobby',score=0,food=null,rng=null,tleft=30,tick=null,av=AV[0],unsub=null,endAt=0,lastOp=-1;
const Rp=(async()=>{try{return await claude.use('room')}catch(e){return null}})();
Rp.then(r=>{R=r;if(!r)$('#nomp').classList.remove('hide')});
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const show=id=>{['lobby','wait','game','end'].forEach(k=>$('#s-'+k).classList.toggle('hide',k!==id))};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=()=>($('#nm').value.trim()||'Player').slice(0,12);
const pr=o=>{try{room&&room.presence(o).catch(()=>{})}catch(e){}};
const opp=()=>bot?{isMe:false,presence:{n:'Bot',a:'🤖',sc:Math.round(botAcc),fin:round}}:room&&room.peers().find(p=>!p.isMe);
const hostPeer=()=>room&&room.peers().find(p=>p.presence.host);
AV.forEach(a=>{const s=document.createElement('span');s.textContent=a;s.onclick=()=>{av=a;[...$('#avs').children].forEach(c=>c.classList.toggle('on',c===s))};if(a===av)s.className='on';$('#avs').appendChild(s)});
async function enter(c,isHost){
 code=c;host=isHost;round=0;lastOp=-1;st='lobby';$('#err').textContent='';
 $('#rc').textContent=c;$('#pls').innerHTML='';$('#go').classList.toggle('hide',!isHost);$('#go').disabled=true;
 $('#wm').textContent='Connecting…';show('wait');
 try{
  if(!R)R=await Promise.race([Rp,new Promise(r=>setTimeout(()=>r(null),8000))]);
  if(!R){$('#wm').textContent='Online play is not available in this view. Open the link in the Claude app or browser while signed in.';return}
  room=await R.join('fg-'+c.toLowerCase());
 }catch(e){$('#wm').textContent='Could not connect. Check your internet and try again.';return}
 pr({n:nm(),a:av,host:isHost,round:0,sc:0,fin:null,go:null});
 unsub=room.onPeers(onPeers);onPeers();
 setTimeout(()=>{if(room&&st==='lobby'&&!host&&!hostPeer())$('#wm').textContent='❌ Room not found. Check the code.'},6000);
}
function onPeers(){
 if(!room)return;const ps=room.peers();
 if(st==='lobby'){
  $('#pls').innerHTML=ps.map(p=>`<div class="pl"><span class="e">${esc(p.presence.a||'🙂')}</span><b>${esc(p.presence.n||'...')}${p.isMe?' (you)':''}</b></div>`).join('');
  const two=ps.length>=2&&hostPeer();
  if(ps.length>2)$('#wm').textContent='Room is full (2 players only)';
  else if(!two)$('#wm').textContent=host?'Waiting for your friend… send them the code 📲':'Looking for the host…';
  else $('#wm').textContent=host?'Your friend is here! Start the game 🔥':'Waiting for the host to start…';
  $('#go').disabled=!(host&&ps.length===2);
 }
 const hp=hostPeer();
 if(hp&&!host&&hp.presence.go&&hp.presence.round>round)begin(hp.presence.round,hp.presence.go);
 const o=opp();if(o)updOpp(o);
 if(st==='end')tryResult();
}
function updOpp(o){const s=+o.presence.sc||0;$('#op-s').textContent=s;$('#op-e').textContent=o.presence.a||'🙂';$('#op-n').textContent=o.presence.n||'';
 if(st==='play'||st==='count'){if(s!==lastOp){$('#op-e').classList.remove('chew');void $('#op-e').offsetWidth;$('#op-e').classList.add('chew');lastOp=s}tug()}}
function tug(){const o=opp(),a=Math.max(0,score),b=Math.max(0,o?+o.presence.sc||0:0);$('#tug').style.width=(a+b?Math.round(a/(a+b)*100):50)+'%'}
$('#mk').onclick=()=>{const L='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=L[Math.floor(Math.random()*L.length)];enter(c,true)};
$('#jn').onclick=()=>{const c=$('#cd-in').value.trim().toUpperCase();if(c.length!==4){$('#err').textContent='Enter the 4-character code';return}enter(c,false)};
$('#cp').onclick=()=>{try{navigator.clipboard.writeText(code).then(()=>{$('#cp').textContent='✅ Copied!'}).catch(()=>{})}catch(e){}};
$('#go').onclick=startHost;$('#again').onclick=startHost;
function startHost(){if(bot){begin(round+1,Math.floor(Math.random()*1e9));return}if(!host||!room||room.peers().length<2)return;const r=round+1,seed=Math.floor(Math.random()*1e9);
 pr({round:r,go:seed,sc:0,fin:null});begin(r,seed)}
function begin(r,seed){round=r;rng=mul(seed);score=0;tleft=30;st='count';lastOp=-1;botAcc=0;clearInterval(botTimer);clearInterval(tick);
 pr({sc:0,fin:null});
 $('#me-e').textContent=av;$('#me-n').textContent=nm()+' (you)';$('#me-s').textContent=0;$('#op-s').textContent=0;$('#tm').textContent=30;$('#tug').style.width='50%';
 const o=opp();if(o){$('#op-e').textContent=o.presence.a||'🙂';$('#op-n').textContent=o.presence.n||''}
 show('game');$('#cd').classList.remove('hide');$('#fe').textContent='🍽️';$('#fe').style.fontSize='7rem';$('#pop').textContent='';
 let c=3;$('#cd').textContent=c;
 tick=setInterval(()=>{c--;if(c>0){$('#cd').textContent=c}else if(c===0){$('#cd').textContent='EAT!'}else{$('#cd').classList.add('hide');clearInterval(tick);play()}},800)}
function nextFood(){let f;do{f=FOODS[Math.floor(rng()*FOODS.length)]}while(f.bad&&food&&food.bad);food={...f,l:f.b};draw()}
function draw(){const f=$('#fe');f.textContent=food.e;f.style.fontSize=food.bad?'7rem':(0.45+0.55*food.l/food.b)*7+'rem'}
function play(){st='play';nextFood();if(bot){const rate=[5,8,11][diff];botTimer=setInterval(()=>{botAcc+=rate*0.25*(0.4+Math.random()*1.2);updOpp(opp())},250)}tick=setInterval(()=>{tleft--;$('#tm').textContent=tleft;if(tleft<=0){clearInterval(tick);finish()}},1000)}
function add(n,txt){score+=n;$('#me-s').textContent=score;pr({sc:score});const p=$('#pop');p.textContent=txt;p.style.color=n<0?'var(--op)':'var(--ac)';tug()}
function bite(){if(st!=='play')return;
 const m=$('#me-e');m.classList.remove('chew');void m.offsetWidth;m.classList.add('chew');try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
 if(food.bad){const f=$('#food');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');add(-4,'Yuck! Broccoli! −4 🤮');nextFood();return}
 food.l--;if(food.l<=0){add(food.p,'+'+food.p+' '+YUM[Math.floor(Math.random()*YUM.length)]);nextFood()}else draw()}
$('#food').addEventListener('pointerdown',e=>{e.preventDefault();bite()});
$('#sk').onclick=()=>{if(st==='play'){$('#pop').textContent='';nextFood()}};
function finish(){clearInterval(botTimer);st='end';endAt=Date.now();pr({sc:score,fin:round});$('#res').textContent='⏳';$('#fs').textContent='Waiting for your friend’s result…';show('end');
 $('#again').classList.toggle('hide',!host);setTimeout(tryResult,4000);tryResult()}
function tryResult(){if(st!=='end')return;const o=opp();if(!o)return;if(o.presence.fin!==round&&Date.now()-endAt<4000)return;
 const a=score,b=+o.presence.sc||0,on=esc(o.presence.n||'Friend');
 $('#res').textContent=a>b?'🏆 You win!':a<b?'😭 '+(o.presence.n||'Friend')+' wins':'🤝 It’s a tie!';
 $('#fs').innerHTML=`You: <b>${a}</b> &nbsp;•&nbsp; ${on}: <b>${b}</b>`+(host?'':'<br>Waiting for the host to start a rematch…')}
async function leave(){clearInterval(botTimer);bot=false;clearInterval(tick);if(unsub)unsub();if(room)try{await room.leave()}catch(e){}room=null;st='lobby';host=false;$('#cp').textContent='📋 Copy code';show('lobby')}
$('#lv').onclick=leave;$('#lv2').onclick=leave;
const DB=[...document.querySelectorAll('.dif button')];DB.forEach((b,i)=>b.onclick=()=>{diff=i;DB.forEach((x,j)=>x.classList.toggle('on',j===i))});
$('#bt').onclick=()=>{bot=true;host=true;room=null;round=0;begin(1,Math.floor(Math.random()*1e9))};
</script>
</body>
</html>
